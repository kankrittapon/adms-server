# ADMS production frontend (SPA) — served by nginx.
# PromptID: ADMS-Frontend-F6-ProductionServing-001
# The API remains a separate service at 192.168.1.248:8081; the browser talks
# to it cross-origin (CORS allowlist includes this origin).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Basic security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # SPA fallback: unknown paths serve index.html (client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never serve source maps or dotfiles
    location ~ /\. {
        deny all;
    }
    location ~* \.map$ {
        deny all;
    }

    location ~* \.(js|css|svg|png|jpg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
